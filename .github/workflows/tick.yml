name: paper-trader tick
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-trader-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one paper-trading tick (no keys, no orders)
        run: python tick.py
      - name: Commit state back
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json decisions.csv tick.log STATUS.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "tick $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') UTC+8"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed, rebasing (attempt $i)"
            git pull --rebase -X theirs || { git rebase --abort; git pull --rebase; }
            sleep $((i*3))
          done
          exit 1
